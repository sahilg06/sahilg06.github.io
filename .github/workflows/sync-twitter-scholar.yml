name: Sync Twitter Scholar (@vibespersecond)

on:
  schedule:
    # Runs every 3 hours at minute :27 (e.g. 05:27 UTC / 10:57 AM IST, 08:27 UTC / 1:57 PM IST, etc.)
    # Using an uncommon minute avoids GitHub Actions shared queue congestion
    - cron: '27 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-twitter-scholar
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync-tweets:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch latest @vibespersecond tweets and update citation indices
        run: python3 scripts/sync_twitter_scholar.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/twitter-scholar.json
          if git diff --staged --quiet; then
            echo "No new tweet updates."
          else
            git commit -m "chore(scholar): auto-sync @vibespersecond tweets and citation metrics"
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin main && break
              echo "Push attempt $i failed, retrying in 5s..."
              sleep 5
            done
          fi
